name: Monthly Horse Update (Manual Only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max number of horses to update (default: 500)'
        required: false
        type: string
        default: '500'

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monthly horse profile update
        run: |
          echo "=== [MonthlyHorseUpdate] $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          echo "HKT: $(TZ='Asia/Hong_Kong' date '+%Y-%m-%d %H:%M')"
          python scripts/batch_horse_scraper.py --limit ${{ github.event.inputs.limit || '500' }}
          echo "=== [MonthlyHorseUpdate] Done ==="

      - name: Summary
        if: always()
        run: |
          echo "## Monthly Horse Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: Manual (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          echo "- Limit: ${{ github.event.inputs.limit || '500' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

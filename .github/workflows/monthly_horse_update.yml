name: Monthly Horse Update

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 28-31 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Monthly update runs on schedule only"

  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium

      - name: Check HKT date and run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          HKT_HOUR=$(TZ='Asia/Hong_Kong' date +%H)
          HKT_DAY=$(TZ='Asia/Hong_Kong' date +%d)
          echo "HKT: $(TZ='Asia/Hong_Kong' date '+%Y-%m-%d %H:%M')"
          if [ "$HKT_DAY" = "01" ] && [ "$HKT_HOUR" -ge "4" ]; then
            echo "Running monthly horse profile update"
            python scripts/batch_horse_scraper.py --limit 500
          else
            echo "Skipped: Not 1st of month in HKT"
          fi

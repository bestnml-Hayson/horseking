name: Smart Sync (Manual Only)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date (YYYY-MM-DD). Leave empty for auto-detect.'
        required: false
        type: string
      venue:
        description: 'Venue (ST/HV/auto). Leave empty for auto-detect.'
        required: false
        type: string
      mode:
        description: 'Sync mode: full (scrape+model), odds-only (update odds only)'
        required: false
        type: string
        default: 'full'

permissions:
  contents: read

concurrency:
  group: smart-sync
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; import supabase; print('[OK] deps loaded')"

      - name: Run Smart Sync
        run: |
          echo "=== [SmartSync] $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          MODE="${{ github.event.inputs.mode || 'full' }}"
          DATE_ARG=""
          VENUE_ARG=""
          [ -n "${{ github.event.inputs.date }}" ] && DATE_ARG="--date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.venue }}" ] && VENUE_ARG="--venue ${{ github.event.inputs.venue }}"

          if [ "$MODE" = "odds-only" ]; then
            python scripts/auto_scraper.py $DATE_ARG $VENUE_ARG --odds-only
          else
            python scripts/smart_sync.py $DATE_ARG $VENUE_ARG
          fi
          echo "=== [SmartSync] Done ==="

      - name: Summary
        if: always()
        run: |
          echo "## Smart Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: Manual (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          echo "- Date: ${{ github.event.inputs.date || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Venue: ${{ github.event.inputs.venue || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ github.event.inputs.mode || 'full' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

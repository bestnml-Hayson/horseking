name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate shared model config
        run: python scripts/validate_config.py

      - name: Verify governance docs exist
        run: |
          test -f docs/PREREGISTERED_AB.md
          test -f docs/MONITORING.md
          test -f FLAGS.md
          test -f RISKS.md

      - name: Python tests (config parity, leakage, odds writer)
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: TypeScript config tests
        run: npm run test:ts
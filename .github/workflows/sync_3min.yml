name: Auto Sync Racing Data (Optimized)

on:
  schedule:
    # 星期一：抓星期三夜賽 acceptances（香港 08:00-18:00，每 60 分鐘）
    - cron: '0 0-10 * * 1'
    # 星期三：賽事日 08:00-23:00 每 20 分鐘
    - cron: '*/20 0-15 * * 3'
    # 星期五：抓星期日日賽 acceptances（香港 08:00-18:00，每 60 分鐘）
    - cron: '0 0-10 * * 5'
    # 星期日：賽事日 08:00-23:00 每 20 分鐘
    - cron: '*/20 0-15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racing-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (fast path)
        shell: bash
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet requests beautifulsoup4 lxml
          python -c "import bs4,lxml,requests; print('  [pip OK]')"

      - name: Run sync_data.ps1 (pipeline)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "=== [sync START] ==="
          & ./sync_data.ps1
          $EXIT=$LASTEXITCODE
          Write-Host "=== [sync END exit=$EXIT] ==="
          if ($EXIT -ne 0) { exit $EXIT }

      - name: Git config (fix push)
        shell: bash
        run: |
          git config user.name "RacingAutoSync[bot]"
          git config user.email "racingsync-bot@users.noreply.github.com"
          BR=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
          if [ "$BR" = "HEAD" ]; then BR="main"; fi
          echo "Using branch: $BR"
          echo "BRANCH=$BR" >> $GITHUB_ENV

      - name: Commit & push data changes (Vercel deploy)
        shell: bash
        run: |
          TARGET_BRANCH="${BRANCH:-main}"
          echo "Target: $TARGET_BRANCH"

          git add -f -A data/ public/ 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "=== CHANGES -> push ==="
            TS=$(date -u +%Y-%m-%dT%H:%MZ)
            git commit -m "[auto] sync: ${TS}"
            for i in 1 2 3; do
              if git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:${TARGET_BRANCH}"; then
                echo "[push OK] Vercel triggered"
                break
              else
                echo "[push FAIL $i] retry"
                git pull --rebase "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TARGET_BRANCH" 2>/dev/null || true
                sleep 8
              fi
            done
          else
            echo "=== NO CHANGES -> skip ==="
          fi

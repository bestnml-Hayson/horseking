name: Post-Race Analysis

on:
  schedule:
    # Run at 2 AM HKT (6 PM UTC) on race days + 1
    # ST: Thu, Sun (after Wed, Sat races)
    # HV: Wed, Fri, Mon (after Tue, Thu, Sun races)
    - cron: '0 18 * * 0,1,3,4'  # Sun, Mon, Wed, Thu UTC = Mon, Tue, Thu, Fri HKT
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  post-race-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          python -c "from supabase import create_client; print('[OK] supabase loaded')"

      - name: Run post-race analysis
        run: |
          echo "=== [PostRaceAnalysis] $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          python scripts/post_race_analyzer.py --all
          echo "=== [PostRaceAnalysis] Done ==="

      - name: Summary
        if: always()
        run: |
          echo "## Post-Race Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

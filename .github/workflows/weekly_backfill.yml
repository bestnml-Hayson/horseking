name: Weekly Historical Backfill (Manual Only)

on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Number of months to backfill (default: 3)'
        required: false
        type: string
        default: '3'
      skip_scrape:
        description: 'Skip scraping, only run analysis on existing data'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  weekly-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; import supabase; print('[OK] deps loaded')"

      - name: Run weekly backfill
        run: |
          echo "=== [WeeklyBackfill] $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          SKIP_ARG=""
          [ "${{ github.event.inputs.skip_scrape }}" = "true" ] && SKIP_ARG="--skip-scrape"
          python scripts/backfill_history.py --months ${{ github.event.inputs.months || '3' }} $SKIP_ARG
          echo "=== [WeeklyBackfill] Done ==="

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Backfill Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: Manual (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          echo "- Months: ${{ github.event.inputs.months || '3' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Skip Scrape: ${{ github.event.inputs.skip_scrape || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

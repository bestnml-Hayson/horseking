name: Weekly Historical Backfill

on:
  schedule:
    # Run every Sunday at 3 AM HKT (7 PM UTC Saturday)
    - cron: '0 19 * * 6'  # Saturday 19:00 UTC = Sunday 03:00 HKT
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  weekly-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; import supabase; print('[OK] deps loaded')"

      - name: Run weekly backfill (last 3 months)
        run: |
          echo "=== [WeeklyBackfill] $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          python scripts/backfill_history.py --months 3
          echo "=== [WeeklyBackfill] Done ==="

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Backfill Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
